# Catalogue of iRacing telemetry variables known to kerb.
# Source of truth for src/iracing/types.rs — see the README.
#
# The union over every car ever seen. iRacing declares only the variables the
# current car has, so entries are added by a merge and never removed by one;
# a variable absent from a session simply resolves to None at connect time.

